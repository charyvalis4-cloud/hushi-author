<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>html,body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style></head><body>
<title>胡適人物導讀</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;900&display=swap">
<style>
/* Layout: one slide card at a time, fixed player bar at the bottom. Republic-era print: blue-grey paper, ink, one red seal. */
:root{
  --bg:#e8edf0; --surface:#f6f8f9; --ink:#17252e; --muted:#4d606b;
  --blue:#2c5a77; --seal:#ad352a; --gold:#b8862a; --line:#c3cfd5; --tint:#dce6eb;
  --serif:'Noto Serif TC','Songti TC','PMingLiU',serif;
  --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e181e; --surface:#15242c; --ink:#e4edf1; --muted:#9bafb9;
    --blue:#86b5d2; --seal:#e2705f; --gold:#e0b55a; --line:#2a3e49; --tint:#1b3039; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e181e; --surface:#15242c; --ink:#e4edf1; --muted:#9bafb9;
  --blue:#86b5d2; --seal:#e2705f; --gold:#e0b55a; --line:#2a3e49; --tint:#1b3039; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.8;font-size:1.05rem}
.wrap{max-width:46rem;margin-inline:auto;padding-inline:1rem;padding-block:1rem 7rem}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;padding-block:.25rem .75rem;color:var(--muted);font-size:.85rem;letter-spacing:.08em}
.top b{font-family:var(--serif);color:var(--ink);letter-spacing:.2em;font-weight:900}
.dots{display:flex;gap:.3rem;margin-bottom:.9rem}
.dots button{flex:1;height:.5rem;border:0;padding:0;background:var(--line);cursor:pointer;border-radius:1px}
.dots button[aria-current="true"]{background:var(--blue)}
.dots button:focus-visible,.bar button:focus-visible,.bar select:focus-visible,a:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:1.5rem 1.25rem 1.25rem;min-width:0}
@media (min-width:600px){.card{padding:2rem 2.25rem 1.75rem}}
.year{font-family:var(--serif);font-weight:900;font-size:clamp(2.4rem,9vw,3.6rem);line-height:1;color:var(--blue);letter-spacing:.02em;padding-bottom:.6rem;border-bottom:1px solid var(--line);margin-bottom:1rem;font-variant-numeric:tabular-nums}
h2{font-family:var(--serif);font-weight:900;font-size:clamp(1.5rem,5.5vw,2rem);line-height:1.35;margin:0 0 1rem;text-wrap:balance}
h3{font-family:var(--serif);margin:0 0 .25rem;font-size:1.2rem}
p{margin:0 0 .9rem;max-width:38em}
b{font-weight:700;color:var(--seal)}
blockquote{margin:1rem 0;padding:1rem 1.1rem 1rem 3rem;background:var(--tint);font-family:var(--serif);font-weight:500;position:relative;line-height:1.8}
blockquote::before{content:"「";position:absolute;left:.8rem;top:.2rem;font-size:2.2rem;color:var(--blue);line-height:1.2}
cite{display:block;margin-top:.4rem;font-family:var(--sans);font-style:normal;font-size:.85rem;color:var(--muted)}
.note{display:flex;gap:.75rem;align-items:flex-start;margin:.75rem 0;padding:.7rem .85rem;border:1px dashed var(--line);font-size:.92rem;line-height:1.7;color:var(--muted)}
.note>div{min-width:0}
.tag{flex:none;background:var(--blue);color:var(--surface);font-size:.75rem;letter-spacing:.12em;padding:.05rem .5rem;margin-top:.15rem;font-weight:700}
.dispute .tag{background:var(--seal)}
.think .tag{background:transparent;color:var(--blue);outline:1px solid var(--blue);outline-offset:-1px}
.chat{margin-top:1.25rem;padding-top:.85rem;border-top:1px solid var(--line)}
.chat-h{font-size:.75rem;letter-spacing:.2em;color:var(--muted);margin-bottom:.45rem}
.chat ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.4rem;align-items:flex-start}
.chat li{background:var(--tint);padding:.3rem .8rem;border-radius:1rem;font-size:.92rem;line-height:1.55;max-width:100%}
.qs{margin:.75rem 0;padding-left:1.4rem}
.qs li{margin-bottom:.4rem;font-family:var(--serif);font-weight:500}
.links{padding-left:1.2rem;margin:.5rem 0}
.links li{margin-bottom:.3rem;overflow-wrap:anywhere}
a{color:var(--blue)}
.trio{display:grid;grid-template-columns:repeat(auto-fit,minmax(11.5rem,1fr));gap:.75rem;margin-bottom:1rem}
.who{border:1px solid var(--line);padding:.8rem .9rem;min-width:0}
.who .role{font-size:.85rem;color:var(--seal);margin-bottom:.4rem;font-weight:700}
.who ul{margin:0;padding-left:1.1rem;font-size:.92rem;line-height:1.65;color:var(--muted)}
.rule{background:var(--tint);padding:.9rem 1rem}
.rule h3{font-size:1.05rem;margin-bottom:.4rem}
.rule p{margin:0 0 .35rem;font-size:.95rem}
/* figures */
.fig{margin:0 0 1.1rem;background:var(--tint);padding:.6rem .8rem .4rem}
.fig svg{display:block;width:100%;height:auto;max-height:11.5rem}
.fig figcaption,.photo figcaption{font-size:.78rem;color:var(--muted);text-align:center;letter-spacing:.1em;margin-top:.2rem}
.fig .t{fill:var(--surface)} .fig .b{fill:var(--blue)} .fig .s{fill:var(--seal)} .fig .i{fill:var(--ink)}
.fig .gold{fill:var(--gold)} .fig .steel{fill:var(--line)} .fig .bgc{fill:var(--tint)}
.fig .o25{opacity:.28} .fig .o50{opacity:.55}
.fig .ln{stroke:var(--ink);stroke-width:2} .fig .ln4{stroke:var(--ink);stroke-width:4;stroke-linecap:round}
.fig .seal-ln{stroke:var(--seal);stroke-width:4;stroke-linecap:round}
.fig .gl{stroke:var(--gold);stroke-width:3} .fig .stem{stroke:var(--ink);stroke-width:3}
.fig .wl{stroke:var(--blue);stroke-width:2;opacity:.6;fill:none} .fig .wl2{stroke:var(--blue);stroke-width:2.5;fill:none}
.fig .grain{stroke:var(--line);stroke-width:2;fill:none} .fig .shine{stroke:var(--surface);stroke-width:3;fill:none;opacity:.8}
.fig text{font-family:var(--serif);font-weight:900}
.fig .tx{fill:var(--ink)} .fig .w{fill:#fff} .fig .bl{fill:var(--blue)} .fig .mu{fill:var(--muted)} .fig .sl{fill:var(--seal)}
.photo{margin:0 0 1.25rem}
.photo img{display:block;width:100%;max-height:17rem;object-fit:cover;object-position:50% 30%;border:1px solid var(--line)}
/* cover */
.cover-top{display:flex;align-items:center;gap:.8rem;margin-bottom:1rem}
.seal{display:inline-block;background:var(--seal);color:#fff;font-family:var(--serif);font-weight:900;font-size:.95rem;line-height:1.15;padding:.35rem .4rem;width:2.4rem;text-align:center;transform:rotate(-4deg)}
.kick{font-size:.85rem;letter-spacing:.2em;color:var(--muted)}
.cover h1{font-family:var(--serif);font-weight:900;font-size:clamp(5rem,26vw,9rem);line-height:1;margin:0;letter-spacing:.06em;color:var(--blue)}
.cover h1 span{color:var(--ink)}
.span{font-family:var(--serif);font-size:1.3rem;letter-spacing:.3em;color:var(--muted);margin:.3rem 0 1.2rem;font-variant-numeric:tabular-nums}
.lead{font-family:var(--serif);font-weight:500;font-size:1.2rem;line-height:1.8}
.chips{list-style:none;padding:0;margin:0 0 .5rem;display:flex;flex-wrap:wrap;gap:.4rem}
.chips li{border:1px solid var(--blue);color:var(--blue);padding:.1rem .7rem;font-size:.88rem}
.chips li:last-child{border-color:var(--seal);color:var(--seal)}

.photos{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem .5rem;margin-top:1rem;font-size:.85rem}
.photos>span{color:var(--muted);letter-spacing:.12em}
.photos a{border:1px solid var(--blue);padding:.05rem .65rem;text-decoration:none}
.photos small{flex-basis:100%;color:var(--muted);font-size:.75rem}
/* player bar */
.bar{position:fixed;inset-inline:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:.6rem 1rem calc(.6rem + env(safe-area-inset-bottom,0px))}
.bar-in{max-width:46rem;margin-inline:auto;display:flex;flex-wrap:wrap;align-items:center;gap:.5rem}
.bar button,.bar select{font:inherit;font-size:.9rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);padding:.35rem .8rem;cursor:pointer;border-radius:3px}
.bar button.primary{background:var(--blue);color:var(--surface);border-color:var(--blue);font-weight:700}
.bar button[aria-pressed="true"]{border-color:var(--seal);color:var(--seal);font-weight:700}
.bar .count{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}
.status{flex-basis:100%;font-size:.8rem;color:var(--muted);min-height:1.2em}
@media (prefers-reduced-motion:no-preference){.slide:not([hidden]){animation:in .25s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}}}
</style>

<div class="wrap">
  <div class="top"><b>胡適</b><span id="pg">國文課・人物導讀</span></div>
  <div class="dots" id="dots" role="tablist" aria-label="頁面"></div>
  <main class="card" id="card"></main>
</div>
<div class="bar"><div class="bar-in">
  <button id="prev" aria-label="上一頁">上一頁</button>
  <button id="play" class="primary">朗讀本頁</button>
  <button id="auto" aria-pressed="false">自動播放</button>
  <label><span class="sr" hidden>語速</span><select id="rate" aria-label="語速"><option value="0.85">慢</option><option value="1" selected>正常</option><option value="1.2">快</option></select></label>
  <button id="next" aria-label="下一頁">下一頁</button>
  <span class="count" id="count"></span>
  <div class="status" id="status" aria-live="polite"></div>
</div></div>

<script>/* 只用臺灣華語（zh-TW）語音，絕不退回大陸（zh-CN）或粵語（zh-HK）語音 */
function twVoice(){var L=[];try{L=speechSynthesis.getVoices()}catch(e){}
var tw=L.filter(function(v){var l=(v.lang||'').replace('_','-').toLowerCase();return l==='zh-tw'||l==='cmn-tw'||l.indexOf('zh-hant-tw')===0||(/^(zh|cmn)/.test(l)&&/taiwan|臺灣|台灣/i.test(v.name))});
tw.sort(function(a,b){return (/natural|online|premium|enhanced/i.test(b.name)?1:0)-(/natural|online|premium|enhanced/i.test(a.name)?1:0)});return tw[0]||null}
function twApply(u){u.lang='zh-TW';var v=twVoice();if(v)u.voice=v;return u}
try{speechSynthesis.getVoices();speechSynthesis.addEventListener('voiceschanged',function(){})}catch(e){}
</script>

\/li><li>中央研究院院長<\/li><li>怕太太？外遇？<\/li><\/ul>\n<div class=\"chat\"><div class=\"chat-h\">網友彈幕<\/div><ul><li>課本只說他倡導白話文，沒說他家有菜刀<\/li><li>今天這堂課的主角：一位教授，三位女子<\/li><\/ul><\/div><\/div>", "narration": "各位同學好。今天的主角是胡適。課本裡的他，是提倡白話文的旗手，是北大校長，是駐美大使。他還有一句名言：大膽假設，小心求證。可是今天，我們要看的是課本比較少寫的一面：他十三歲就被訂了婚，一輩子卻遇上兩位讓他心動的女子。一位是教授的女兒，一位是他的表妹。這三個人，加起來就是一部民國版的情感大戲。準備好了嗎？我們從十三歲說起。"}, {"year": "1904", "label": "十三歲，被灶神抽中的新娘", "html": "<div class=\"year\">1904<\/div><h2>十三歲，被灶神抽中的新娘<\/h2><figure class=\"fig\"><svg viewBox=\"0 0 600 170\" role=\"img\" aria-label=\"灶神前的竹筒與八字紅紙\"><line class=\"ln\" x1=\"30\" x2=\"570\" y1=\"152\" y2=\"152\"/><rect class=\"s\" x=\"66\" y=\"28\" width=\"138\" height=\"16\"/><rect class=\"t ln\" x=\"80\" y=\"44\" width=\"110\" height=\"108\"/><text class=\"tx\" x=\"135\" y=\"104\" text-anchor=\"middle\" font-size=\"30\">灶君<\/text><rect class=\"s\" x=\"298\" y=\"24\" width=\"8\" height=\"50\" transform=\"rotate(-8 302 74)\"/><rect class=\"s\" x=\"314\" y=\"16\" width=\"8\" height=\"58\"/><rect class=\"s\" x=\"330\" y=\"26\" width=\"8\" height=\"48\" transform=\"rotate(9 334 74)\"/><rect class=\"t ln\" x=\"290\" y=\"62\" width=\"64\" height=\"90\" rx=\"5\"/><line class=\"ln\" x1=\"290\" x2=\"354\" y1=\"92\" y2=\"92\"/><line class=\"ln\" x1=\"290\" x2=\"354\" y1=\"122\" y2=\"122\"/><line class=\"ln4\" x1=\"408\" y1=\"28\" x2=\"392\" y2=\"150\"/><line class=\"ln4\" x1=\"422\" y1=\"28\" x2=\"406\" y2=\"150\"/><rect class=\"s\" x=\"450\" y=\"42\" width=\"76\" height=\"106\"/><text class=\"w\" x=\"488\" y=\"106\" text-anchor=\"middle\" font-size=\"28\">八字<\/text><\/svg><figcaption>灶君前的竹筒、紅紙與筷子<\/figcaption><\/figure><p>一九〇四年，胡適十三歲，母親馮順弟為他訂下與江冬秀的婚約。<\/p><p>過程很有儀式感：母親把江冬秀的八字寫在紅紙上，和其他女孩的八字一起放進灶神面前的竹筒。家裡一陣子平安無事，她才拜過灶神、搖一搖竹筒，用筷子夾出一張，夾出來的正是江冬秀。算命先生還說，兩人不沖不克，江冬秀大一歲也沒關係。<\/p><p>胡適的父親胡傳五十歲才得到他，在一八九五年病逝。馮順弟是胡傳的第三任妻子，從此獨力撐起這個家，所以母親說了算。<\/p><div class=\"note src\"><span class=\"tag\">史料<\/span><div>抽籤的細節出自《關鍵評論》整理的胡適傳記資料；父親、母親與訂婚年份取自你手上的講義。<\/div><\/div><div class=\"note src dispute\"><span class=\"tag\">爭議<\/span><div>訂婚時的年紀，講義寫十三歲，也有資料寫十一歲，應是虛歲、實歲的算法不同。<\/div><\/div><div class=\"photos\"><span>找老照片<\/span><a href=\"https://commons.wikimedia.org/w/index.php?search=%E8%83%A1%E9%81%A9&title=Special%3AMediaSearch&type=image\" target=\"_blank\" rel=\"noopener\">胡適<\/a><small>連到維基共享資源搜尋，使用前請確認授權。<\/small><\/div><div class=\"chat\"><div class=\"chat-h\">網友彈幕<\/div><ul><li>這不是抽籤，是命運盲盒<\/li><li>十三歲的人生，被一支筷子決定了<\/li><\/ul><\/div>", "narration": "第一站，一九零四年。胡適十三歲，還沒出國，也還沒聽過什麼叫自由戀愛。他的母親馮順弟，把江冬秀的八字寫在紅紙上，和其他女孩的八字一起放進灶神面前的竹筒。過了一陣子家裡平安無事，母親才虔誠地拜過灶神，搖一搖竹筒，用筷子夾出一張。夾出來的，剛好就是江冬秀。你們想想，這個婚約，胡適本人有投票嗎？沒有。他的父親胡傳在他三四歲時就去世了，所以這位母親說了算。順帶一提，年齡的說法不一，講義寫十三歲，也有資料寫十一歲，這是查史料常見的小差異。"}, {"year": "1914", "label": "康乃爾的教授女兒", "html": "<div class=\"year\">1914<\/div><h2>康乃爾的教授女兒<\/h2><figure class=\"fig\"><svg viewBox=\"0 0 600 170\" role=\"img\" aria-label=\"一疊用細繩綁起來的信與墨水瓶\"><line class=\"ln\" x1=\"30\" x2=\"570\" y1=\"152\" y2=\"152\"/><g transform=\"rotate(-6 200 90)\"><rect class=\"t ln\" x=\"108\" y=\"48\" width=\"190\" height=\"100\"/><path class=\"ln\" fill=\"none\" d=\"M108 48 L203 106 L298 48\"/><\/g><g transform=\"rotate(5 220 90)\"><rect class=\"t ln\" x=\"130\" y=\"36\" width=\"190\" height=\"100\"/><path class=\"ln\" fill=\"none\" d=\"M130 36 L225 94 L320 36\"/><\/g><rect class=\"t ln\" x=\"150\" y=\"28\" width=\"190\" height=\"104\"/><path class=\"ln\" fill=\"none\" d=\"M150 28 L245 88 L340 28\"/><line class=\"seal-ln\" x1=\"245\" x2=\"245\" y1=\"28\" y2=\"132\"/><circle class=\"s\" cx=\"245\" cy=\"88\" r=\"9\"/><rect class=\"i\" x=\"410\" y=\"102\" width=\"48\" height=\"50\" rx=\"9\"/><rect class=\"t ln\" x=\"423\" y=\"90\" width=\"22\" height=\"14\"/><line class=\"seal-ln\" x1=\"440\" y1=\"90\" x2=\"520\" y2=\"22\"/><text class=\"bl\" x=\"505\" y=\"132\" text-anchor=\"middle\" font-size=\"34\">100+<\/text><\/svg><figcaption>一百多封信，從康乃爾寫到哥倫比亞<\/figcaption><\/figure><p>胡適剛到美國時，記著母親的叮嚀「男女交際尤須留心」，有四年幾乎不和女同學往來。一九一四年，他認識了康乃爾大學地質學教授的女兒韋蓮司。<\/p><p>她比胡適大六歲，是畫家，從小受西方教育，從不人云亦云。<\/p><blockquote>人品高，學識富，極能思想，高潔幾近狂狷……其真能具思想、識力、魄力、熱誠於一身者，惟一人耳。<cite>胡適評韋蓮司（講義）<\/cite><\/blockquote><p>胡適說「狂」是美德。韋蓮司淡淡回他：若是故作狂態，那就不足取。兩人月下散步、湖邊談心，到胡適回國前，通信超過一百封。<\/p><p>可是胡適早有婚約，韋蓮司的母親也不喜歡女兒和中國人來往。這段感情，始終無法再往前一步。<\/p><div class=\"note src dispute\"><span class=\"tag\">爭議<\/span><div>初識時間，講義與《關鍵評論》作一九一四年，也有文章寫一九一五年一月。兩人的關係多被形容為精神戀愛，細節仍有不同說法。<\/div><\/div><div class=\"photos\"><span>找老照片<\/span><a href=\"https://commons.wikimedia.org/w/index.php?search=Edith%20Clifford%20Williams&title=Special%3AMediaSearch&type=image\" target=\"_blank\" rel=\"noopener\">韋蓮司<\/a><a href=\"https://commons.wikimedia.org/w/index.php?search=Cornell%20University&title=Special%3AMediaSearch&type=image\" target=\"_blank\" rel=\"noopener\">康乃爾大學<\/a><small>連到維基共享資源搜尋，使用前請確認授權。<\/small><\/div><div class=\"chat\"><div class=\"chat-h\">網友彈幕<\/div><ul><li>被她一句話堵回來，還更欣賞她<\/li><li>上百封信，比現在的限時動態還長<\/li><\/ul><\/div>", "narration": "第二站，一九一四年，美國康乃爾大學。胡適剛到美國時，母親叮嚀他，男女交際要留心，他真的有四年幾乎不跟女同學來往。直到他認識了韋蓮司，康乃爾地質學教授的女兒。她比胡適大六歲，是個畫家，從小受西方教育，不人云亦云。胡適稱讚她人品高、學識富、極能思想，說他看過那麼多女子，真正兼具思想、識力、魄力、熱誠的，只有她一人。有趣的是，胡適稱讚狂是美德，韋蓮司卻淡淡回他一句：如果是故作狂態，那就不足取。兩個人月下散步、湖邊談心，寫的信超過一百封。可是，胡適已經有婚約，韋蓮司的母親也不喜歡女兒跟中國人來往。這段感情，始終沒辦法再往前一步。"}, {"year": "1959", "label": "她賣掉了養老的房子", "html": "<div class=\"year\">1959<\/div><h2>她賣掉了養老的房子<\/h2><figure class=\"fig\"><svg viewBox=\"0 0 600 170\" role=\"img\" aria-label=\"掛著售字牌的房子與一疊書\"><line class=\"ln\" x1=\"30\" x2=\"570\" y1=\"152\" y2=\"152\"/><polygon class=\"b\" points=\"88,92 190,40 292,92\"/><rect class=\"t ln\" x=\"110\" y=\"92\" width=\"160\" height=\"60\"/><rect class=\"s\" x=\"176\" y=\"112\" width=\"28\" height=\"40\"/><line class=\"ln4\" x1=\"330\" y1=\"56\" x2=\"330\" y2=\"152\"/><rect class=\"s\" x=\"302\" y=\"60\" width=\"56\" height=\"38\"/><text class=\"w\" x=\"330\" y=\"88\" text-anchor=\"middle\" font-size=\"26\">售<\/text><text class=\"mu\" x=\"394\" y=\"116\" text-anchor=\"middle\" font-size=\"40\">→<\/text><rect class=\"b\" x=\"440\" y=\"126\" width=\"120\" height=\"26\"/><rect class=\"s\" x=\"450\" y=\"100\" width=\"100\" height=\"26\"/><rect class=\"t ln\" x=\"445\" y=\"74\" width=\"110\" height=\"26\"/><text class=\"tx\" x=\"500\" y=\"64\" text-anchor=\"middle\" font-size=\"20\">基金<\/text><\/svg><figcaption>賣掉養老的房子，換成一筆基金<\/figcaption><\/figure><p>一九五九年，七十四歲的韋蓮司為了替胡適建立基金會，賣掉自己養老的房子。她說，想為他重要著作的出版和英譯盡一點力。<\/p><p>她終身未嫁。<\/p><p>一九六二年胡適逝世，這時出現一個讓人意外的動作：妻子江冬秀，把一張韋蓮司的照片，放進了胡適的陪葬品中。<\/p><p>據報導，韋蓮司晚年也整理了與胡適往來的書信，與江冬秀一起為胡適出書。<\/p><div class=\"note src\"><span class=\"tag\">史料<\/span><div>基金會、賣房與陪葬照片，見講義與《關鍵評論》報導。<\/div><\/div><div class=\"note src think\"><span class=\"tag\">思考<\/span><div>江冬秀為什麼這麼做？是釋懷、成全，還是另有想法？史料沒有給出答案，你怎麼推測？<\/div><\/div><div class=\"chat\"><div class=\"chat-h\">網友彈幕<\/div><ul><li>江冬秀這一步，格局比菜刀大很多<\/li><li>三個人，居然沒有一個是壞人<\/li><\/ul><\/div>", "narration": "但故事沒有結束。一九五九年，七十四歲的韋蓮司，為了替胡適建立基金會，賣掉了自己養老的房子。她終身沒有結婚。三年後，胡適過世，這時候出現一個讓人意想不到的動作：他的妻子江冬秀，把一張韋蓮司的照片，放進了胡適的陪葬品當中。江冬秀為什麼這麼做？是釋懷、是成全，還是另有想法？這個問題，老師想先留給你們。"}, {"year": "1917", "label": "婚禮上的伴娘，是他的表妹", "html": "<div class=\"year\">1917<\/div><h2>婚禮上的伴娘，是他的表妹<\/h2><figure class=\"fig\"><svg viewBox=\"0 0 600 170\" role=\"img\" aria-label=\"紅色囍字與兩盞燈籠\"><line class=\"ln\" x1=\"130\" x2=\"130\" y1=\"8\" y2=\"42\"/><ellipse class=\"s\" cx=\"130\" cy=\"82\" rx=\"34\" ry=\"40\"/><rect class=\"i\" x=\"116\" y=\"38\" width=\"28\" height=\"7\"/><rect class=\"i\" x=\"116\" y=\"120\" width=\"28\" height=\"7\"/><line class=\"gl\" x1=\"130\" x2=\"130\" y1=\"127\" y2=\"160\"/><line class=\"ln\" x1=\"470\" x2=\"470\" y1=\"8\" y2=\"42\"/><ellipse class=\"s\" cx=\"470\" cy=\"82\" rx=\"34\" ry=\"40\"/><rect class=\"i\" x=\"456\" y=\"38\" width=\"28\" height=\"7\"/><rect class=\"i\" x=\"456\" y=\"120\" width=\"28\" height=\"7\"/><line class=\"gl\" x1=\"470\" x2=\"470\" y1=\"127\" y2=\"160\"/><g transform=\"translate(300 85) rotate(45)\"><rect class=\"s\" x=\"-58\" y=\"-58\" width=\"116\" height=\"116\"/><\/g><text class=\"w\" x=\"300\" y=\"108\" text-anchor=\"middle\" font-size=\"66\">囍<\/text><\/svg><figcaption>一九一七年的婚禮，伴娘也在場<\/figcaption><\/figure><p>一九一七年，胡適學成回國，依母命與江冬秀結婚。婚禮上，他認識了表妹曹誠英。她留下來當伴娘，一口一個「糜哥」，因為胡適原名胡嗣糜。<\/p><p>胡適幾天後回北京。一年後他回鄉奔母喪，曹誠英已被家裡安排，嫁給同鄉的胡冠英。<\/p><p>她不想一輩子當少奶奶，一九二〇年在哥哥幫助下，進入杭州的省立女子師範學校讀書。三年後，她與胡冠英離婚：婆家認為她不能傳宗接代，還另替兒子娶了妾。<\/p><p>這時的曹誠英，是一位剛離婚、靠自己讀書的新女性。<\/p><div class=\"note src\"><span class=\"tag\">史料<\/span><div>曹誠英的早年經歷，取自杭州市官方方志網站《方志杭州》的文章。<\/div><\/div><div class=\"photos\"><span>找老照片<\/span><a href=\"https://commons.wikimedia.org/w/index.php?search=%E6%9B%B9%E8%AA%A0%E8%8B%B1&title=Special%3AMediaSearch&type=image\" target=\"_blank\" rel=\"noopener\">曹誠英<\/a><small>連到維基共享資源搜尋，使用前請確認授權。<\/small><\/div><div class=\"chat\"><div class=\"chat-h\">網友彈幕<\/div><ul><li>一聲糜哥，叫得他心頭熱乎乎<\/li><li>被嫌不能生，她選擇離開，我給她按讚<\/li><\/ul><\/div>", "narration": "第三站，一九一七年。胡適學成回國，依照母親的安排，和江冬秀結婚。婚禮上，他認識了一位表妹，叫曹誠英。她是伴娘，一口一個糜哥，因為胡適本名叫胡嗣糜。胡適幾天後回到北京，心裡已經留下了印象。一年後，曹誠英被家裡安排，嫁給同鄉的胡冠英。不過她不想當一輩子的少奶奶，一九二零年到杭州女子師範學校讀書。三年後，她離了婚，原因是婆家認為她不能傳宗接代，甚至又替兒子娶了妾。注意，這時候的曹誠英，是一位剛離婚、靠自己讀書的新女性。"}, {"year": "1923", "label": "西湖邊的一篇短文", "html": "<div class=\"year\">1923<\/div><h2>西湖邊的一篇短文<\/h2><figure class=\"fig\"><svg viewBox=\"0 0 600 170\" role=\"img\" aria-label=\"月夜的西湖：遠山、柳枝與小船\"><circle class=\"t ln\" cx=\"470\" cy=\"46\" r=\"22\"/><path class=\"b o25\" d=\"M0 118 Q80 60 160 108 T320 98 T480 104 T600 92 L600 150 L0 150Z\"/><path class=\"b o50\" d=\"M0 142 Q120 92 230 130 T420 128 T600 122 L600 160 L0 160Z\"/><path class=\"wl\" d=\"M30 156 H120 M180 162 H300 M420 158 H560\" /><path class=\"i\" d=\"M246 146 Q300 168 366 146Z\"/><path class=\"t ln\" d=\"M282 146 Q306 112 338 146Z\"/><path class=\"wl2\" fill=\"none\" d=\"M44 14 Q64 66 48 124 M62 14 Q86 60 70 110 M80 14 Q104 52 92 96 M28 14 Q40 70 24 120\"/><\/svg><figcaption>西湖：霧、月光與船篷<\/figcaption><\/figure><p>一九二三年，胡適因病到杭州休養，曹誠英正在杭州女師讀書，兩人重逢。<\/p><p>這一年，胡適寫了〈西湖〉。文中寫霧、寫月光，也寫「我的心也跟著湖光微蕩了」；他說前些天的「伊」未免太絢爛，大家只好在船篷陰處偷偷看她。<\/p><p>講義的解讀是：<b>明寫西湖，暗喻曹誠英。<\/b><\/p><div class=\"note src think\"><span class=\"tag\">國文連結<\/span><div>借景抒情、雙關、指代。「伊」是西湖，還是人？請你從文句找證據。<\/div><\/div><div class=\"note src dispute\"><span class=\"tag\">爭議<\/span><div>「伊」是否指曹誠英，是後人的解讀，胡適並沒有明說。至於兩人在煙霞洞租屋同住的說法，出自個人部落格，缺少明確出處，請當成待查證的傳聞。<\/div><\/div><div class=\"photos\"><span>找老照片<\/span><a href=\"https://commons.wikimedia.org/w/index.php?search=%E8%A5%BF%E6%B9%96%20%E6%9D%AD%E5%B7%9E&title=Special%3AMediaSearch&type=image\" target=\"_blank\" rel=\"noopener\">西湖<\/a><small>連到維基共享資源搜尋，使用前請確認授權。<\/small><\/div><div class=\"chat\"><div class=\"chat-h\">網友彈幕<\/div><ul><li>這就是古代版（民國版）的借景抒情<\/li><li>國文老師：所以「伊」到底是誰？<\/li><\/ul><\/div>", "narration": "第四站，一九二三年，西湖。胡適生病，到杭州休養，曹誠英正好在杭州讀書，兩人重逢。這段時間的細節，主要來自後人的文章，說法不一。有一種說法是他們曾在煙霞洞租屋同住，這一點請大家當成待查證的說法。有趣的是，胡適寫了一篇短文，題目叫西湖。裡面說，月光照著，我的心也跟著湖光微微盪漾了。又說，伊未免太絢爛了。這個伊，講義的解讀是：明寫西湖，暗喻曹誠英。老師要問，這個伊，到底是西湖，還是人？這就是國文課常說的借景抒情、雙關。不過要記得，這是後人的解讀，胡適自己並沒有說明。"}, {"year": "1923–25", "label": "一把菜刀，擋下一場離婚", "html": "<div class=\"year\">1923–25<\/div><h2>一把菜刀，擋下一場離婚<\/h2><figure class=\"fig\"><svg viewBox=\"0 0 600 170\" role=\"img\" aria-label=\"砧板上的一把菜刀\"><rect class=\"t ln\" x=\"80\" y=\"112\" width=\"440\" height=\"40\" rx=\"6\"/><path class=\"grain\" d=\"M110 126 H300 M330 138 H490 M150 142 H260\"/><g transform=\"rotate(-8 300 78)\"><rect class=\"steel ln\" x=\"170\" y=\"26\" width=\"236\" height=\"84\" rx=\"10\"/><circle class=\"bgc\" cx=\"196\" cy=\"52\" r=\"6\"/><path class=\"shine\" d=\"M230 44 H380\"/><rect class=\"s ln\" x=\"404\" y=\"58\" width=\"104\" height=\"22\" rx=\"11\"/><\/g><\/svg><figcaption>一把菜刀，擋下一場離婚<\/figcaption><\/figure><p>胡適想離婚。講義寫道：江冬秀走進廚房，拿了一把菜刀出來，說——<\/p><blockquote>兩個兒子是我生的，殺了兒子再和你離婚！<cite>江冬秀（講義）<\/cite><\/blockquote><p>離婚不成。據講義，兩人只能像牛郎織女一樣，每年在杭州、上海或南京相會。胡適回到北京西山，寫下〈秘魔崖月夜〉，抒發思念。<\/p><p>換個角度想：江冬秀從十三年前訂婚等到成婚，這時要守住的是整個家。<\/p><div class=\"note src dispute\"><span class=\"tag\">爭議<\/span><div>離婚風波的時間，講義寫一九二三至一九二五年，另有文章寫一九二四年。菜刀的情節與台詞，多為後人轉述，細節版本不一。<\/div><\/div><div class=\"chat\"><div class=\"chat-h\">網友彈幕<\/div><ul><li>菜刀在手，天下我有<\/li><li>胡適：我再也不提那個字了<\/li><\/ul><\/div>", "narration": "好了，胡適想離婚。他回到北京，跟江冬秀攤牌。講義上寫，江冬秀走進廚房，拿了一把菜刀出來，說：兩個兒子是我生的，我先殺了兒子，再跟你離婚！你們猜胡適怎麼辦？他再也不敢提離婚兩個字。離不成婚，只好像牛郎織女一樣，每年在杭州、上海或南京，跟曹誠英見面。年份上，講義寫一九二三到二五年之間，另一種說法是一九二四年，細節也多半是後人轉述。不過請大家換個角度想：江冬秀從訂婚等到成婚，等了十三年，這時候她要守住的，是整個家。"}, {"year": "1925–", "label": "她選了胡適讀過的科系", "html": "<div class=\"year\">1925–<\/div><h2>她選了胡適讀過的科系<\/h2><figure class=\"fig\"><svg viewBox=\"0 0 600 170\" role=\"img\" aria-label=\"一穗麥子與一本翻開的書\"><line class=\"ln\" x1=\"30\" x2=\"570\" y1=\"152\" y2=\"152\"/><path class=\"stem\" fill=\"none\" d=\"M150 152 Q158 96 150 24\"/><ellipse class=\"gold\" cx=\"141\" cy=\"36\" rx=\"6\" ry=\"12\" transform=\"rotate(-28 141 36)\"/><ellipse class=\"gold\" cx=\"159\" cy=\"36\" rx=\"6\" ry=\"12\" transform=\"rotate(28 159 36)\"/><ellipse class=\"gold\" cx=\"141\" cy=\"52\" rx=\"6\" ry=\"12\" transform=\"rotate(-28 141 52)\"/><ellipse class=\"gold\" cx=\"159\" cy=\"52\" rx=\"6\" ry=\"12\" transform=\"rotate(28 159 52)\"/><ellipse class=\"gold\" cx=\"141\" cy=\"68\" rx=\"6\" ry=\"12\" transform=\"rotate(-28 141 68)\"/><ellipse class=\"gold\" cx=\"159\" cy=\"68\" rx=\"6\" ry=\"12\" transform=\"rotate(28 159 68)\"/><ellipse class=\"gold\" cx=\"141\" cy=\"84\" rx=\"6\" ry=\"12\" transform=\"rotate(-28 141 84)\"/><ellipse class=\"gold\" cx=\"159\" cy=\"84\" rx=\"6\" ry=\"12\" transform=\"rotate(28 159 84)\"/><ellipse class=\"gold\" cx=\"141\" cy=\"100\" rx=\"6\" ry=\"12\" transform=\"rotate(-28 141 100)\"/><ellipse class=\"gold\" cx=\"159\" cy=\"100\" rx=\"6\" ry=\"12\" transform=\"rotate(28 159 100)\"/><ellipse class=\"gold\" cx=\"150\" cy=\"18\" rx=\"6\" ry=\"11\"/><polygon class=\"t ln\" points=\"300,58 400,70 400,150 300,138\"/><polygon class=\"t ln\" points=\"400,70 500,58 500,138 400,150\"/><text class=\"tx\" x=\"350\" y=\"116\" text-anchor=\"middle\" font-size=\"36\">農<\/text><text class=\"tx\" x=\"450\" y=\"116\" text-anchor=\"middle\" font-size=\"36\">哲<\/text><\/svg><figcaption>農科的起點，與一本翻開的書<\/figcaption><\/figure><p>一九二五年六月，曹誠英從杭州女師畢業，本想報考北京大學，又怕給胡適添麻煩。九月，經胡適介紹，她進入南京東南大學農藝系。<\/p><p>胡適當年在康乃爾，也是先讀農科，後來才轉文哲。有文章推測，她是想替胡適走完那條未竟的科學之路。<\/p><p>她後來也到康乃爾留學、取得碩士學位，回國後在安徽大學農學院任教，講義稱她是<b>中國農學界第一位女教授<\/b>。<\/p><p>她終身未再嫁，一九七三年在上海病逝。<\/p><div class=\"note src\"><span class=\"tag\">史料<\/span><div>留學、碩士與「第一位女教授」見講義。<\/div><\/div><div class=\"note src dispute\"><span class=\"tag\">爭議<\/span><div>入學經過、推測動機與去世年份，出自個人部落格，請在引用前再核對。<\/div><\/div><div class=\"chat\"><div class=\"chat-h\">網友彈幕<\/div><ul><li>她不是配角，她是自己人生的主角<\/li><li>選農科這件事，我讀出了心事<\/li><\/ul><\/div>", "narration": "曹誠英後來的人生，其實非常精彩。她畢業後本來想考北大，又怕給胡適添麻煩。後來經過胡適介紹，進了南京東南大學農藝系。而胡適早年在康乃爾，一開始也是讀農科。有人說，她是想替胡適走完那條沒走完的科學之路，這是文章作者的推測。總之，她後來也到康乃爾留學，拿到碩士學位，回國當教授，講義說她是中國農學界第一位女教授。她終身沒有再嫁，一九七三年在上海過世，這點來自部落格文章，上課前請再核對。她不只是胡適故事裡的配角，她自己就是一個很了不起的人。"}, {"year": "對照", "label": "三位女子對照", "html": "<div class=\"year\">對照<\/div><h2>一位教授，三位女子<\/h2><div class=\"trio\">\n<div class=\"who\"><h3>江冬秀<\/h3><div class=\"role\">母親安排的婚姻<\/div><ul><li>1904 訂婚，1917 成婚<\/li><li>守住家庭，菜刀為證<\/li><li>1962 把韋蓮司的照片放進陪葬品<\/li><\/ul><\/div>\n<div class=\"who\"><h3>韋蓮司<\/h3><div class=\"role\">康乃爾的靈魂伴侶<\/div><ul><li>教授的女兒，畫家<\/li><li>通信上百封<\/li><li>1959 賣房建基金會，終身未嫁<\/li><\/ul><\/div>\n<div class=\"who\"><h3>曹誠英<\/h3><div class=\"role\">婚禮上認識的表妹<\/div><ul><li>1917 當伴娘<\/li><li>1923 西湖重逢<\/li><li>後成為農學教授，終身未再嫁<\/li><\/ul><\/div>\n<\/div><div class=\"rule\"><h3>講義裡的「核心技能」：男子三從四德<\/h3>\n<p><b>三從<\/b>　太太出門要跟從、太太命令要服從、太太說錯要盲從<\/p>\n<p><b>四德<\/b>　太太化妝要等得、太太生日要記得、太太打罵要忍得、太太花錢要捨得<\/p><\/div><div class=\"chat\"><div class=\"chat-h\">網友彈幕<\/div><ul><li>說他渣男的，請先回答：三個人各自付出了什麼<\/li><li>怕太太是真的，但胡適也是真的難離開她<\/li><\/ul><\/div>", "narration": "我們把三位女性放在一起看。江冬秀，母親安排的婚姻，一輩子的太太；韋蓮司，康乃爾的靈魂伴侶，信寫了上百封；曹誠英，表妹，西湖邊的戀情。講義的核心技能這一欄，還幫胡適歸納了男子三從四德。三從：太太出門要跟從、太太命令要服從、太太說錯要盲從。四德：太太化妝要等得、太太生日要記得、太太打罵要忍得、太太花錢要捨得。這就是民國版的怕太太守則。你們覺得，他是真的做到了，還是只有嘴上說說？"}, {"year": "評價", "label": "渣男，還是時代的矛盾？", "html": "<div class=\"year\">評價<\/div><h2>渣男，還是時代的矛盾？<\/h2><figure class=\"fig\"><svg viewBox=\"0 0 600 170\" role=\"img\" aria-label=\"天平：成就與影響\"><rect class=\"i\" x=\"270\" y=\"146\" width=\"60\" height=\"8\"/><line class=\"ln4\" x1=\"300\" y1=\"50\" x2=\"300\" y2=\"146\"/><line class=\"ln4\" x1=\"160\" y1=\"58\" x2=\"440\" y2=\"58\"/><circle class=\"i\" cx=\"300\" cy=\"58\" r=\"8\"/><line class=\"ln\" x1=\"160\" y1=\"58\" x2=\"118\" y2=\"106\"/><line class=\"ln\" x1=\"160\" y1=\"58\" x2=\"202\" y2=\"106\"/><line class=\"ln\" x1=\"440\" y1=\"58\" x2=\"398\" y2=\"106\"/><line class=\"ln\" x1=\"440\" y1=\"58\" x2=\"482\" y2=\"106\"/><path class=\"b\" d=\"M108 106 H212 Q160 138 108 106Z\"/><path class=\"s\" d=\"M388 106 H492 Q440 138 388 106Z\"/><text class=\"tx\" x=\"160\" y=\"158\" text-anchor=\"middle\" font-size=\"20\">成就<\/text><text class=\"tx\" x=\"440\" y=\"158\" text-anchor=\"middle\" font-size=\"20\">影響<\/text><text class=\"sl\" x=\"300\" y=\"34\" text-anchor=\"middle\" font-size=\"34\">？<\/text><\/svg><figcaption>才華與傷害，放不放得上同一座天平？<\/figcaption><\/figure><p>他在一九一七年於《新青年》發表〈文學改良芻議〉，倡導白話文；一九二〇年出版第一部白話詩集《嘗試集》；一生提倡自由、民主與科學。一九六二年二月，他在中央研究院的院士酒會上心臟病突發逝世。<\/p><p>感情上，他沒有離婚，也沒有完全放下另外兩位女子。有人批評，他讓三個女人都付出了代價；也有人說，他始終沒有拋棄任何人，是在新舊之間扛著責任。<\/p><ol class=\"qs\"><li>才華與成就，能抵消他對三個人的影響嗎？<\/li><li>如果你是江冬秀，你會怎麼做？如果你是曹誠英呢？<\/li><li>用他自己的「大膽假設，小心求證」檢查今天的故事：哪些是史料，哪些只是推測？<\/li><\/ol><div class=\"note src\"><span class=\"tag\">說明<\/span><div>以上評價屬詮釋性觀點，學界與大眾看法不一。<\/div><\/div><div class=\"photos\"><span>找老照片<\/span><a href=\"https://commons.wikimedia.org/w/index.php?search=%E8%83%A1%E9%81%A9&title=Special%3AMediaSearch&type=image\" target=\"_blank\" rel=\"noopener\">胡適<\/a><a href=\"https://commons.wikimedia.org/w/index.php?search=%E6%96%B0%E9%9D%92%E5%B9%B4%20%E9%9B%9C%E8%AA%8C&title=Special%3AMediaSearch&type=image\" target=\"_blank\" rel=\"noopener\">新青年<\/a><small>連到維基共享資源搜尋，使用前請確認授權。<\/small><\/div><div class=\"chat\"><div class=\"chat-h\">網友彈幕<\/div><ul><li>他寫白話文給我們讀，也寫了一堆麻煩給我們討論<\/li><li>結論：不要只用一個標籤看一個人<\/li><\/ul><\/div>", "narration": "最後，我們回頭問：胡適到底是渣男，還是時代的矛盾？他在一九一七年發表文學改良芻議，倡導白話文；一九二零年出版第一部白話詩集嘗試集；一生提倡自由、民主與科學。一九六二年二月，他在中央研究院的院士酒會上心臟病突發過世。但在感情上，他沒有跟江冬秀離婚，也沒有完全放下另外兩位女性。有人批評他讓三個女人都付出了代價，也有人說他始終沒有拋棄任何人。你站哪一邊？別忘了他自己的名言：大膽假設，小心求證。今天我們聽到的這些故事，哪些是史料，哪些只是推測？請同學帶著這個問題，寫下你的看法。"}, {"year": "出處", "label": "出處", "html": "<div class=\"year\">出處<\/div><h2>史料與說法不一<\/h2><p>本頁以你手上的〈胡適〉講義為主軸，網路資料補充。不同來源常有出入，已在畫面上標示。<\/p><ul class=\"links\"><li><a href=\"https://www.thenewslens.com/article/132299\" target=\"_blank\" rel=\"noopener\">《關鍵評論》：胡適之婚姻與愛情<\/a><\/li><li><a href=\"https://www.gvm.com.tw/article/5440\" target=\"_blank\" rel=\"noopener\">《遠見》：談胡適與韋蓮司的訪談<\/a><\/li><li><a href=\"https://news.cnyes.com/news/id/815109\" target=\"_blank\" rel=\"noopener\">鉅亨網：胡適與美國情人的姐弟戀<\/a><\/li><li><a href=\"https://hznews.hangzhou.com.cn/wghz/content/2018-05/15/content_7002207.htm\" target=\"_blank\" rel=\"noopener\">《方志杭州》：曹誠英的早年經歷<\/a><\/li><li><a href=\"https://blog.udn.com/leechangsheng4444/6509875\" target=\"_blank\" rel=\"noopener\">個人部落格：胡適與曹誠英（待核對）<\/a><\/li><li><a href=\"https://mhdb.mh.sinica.edu.tw/magazine/web/acwp_author.php?no=693\" target=\"_blank\" rel=\"noopener\">中央研究院：胡適年表<\/a><\/li><li><a href=\"https://en.wikipedia.org/wiki/Hu_Shih\" target=\"_blank\" rel=\"noopener\">Wikipedia：Hu Shih<\/a><\/li><\/ul><div class=\"note src dispute\"><span class=\"tag\">提醒<\/span><div>個人部落格的細節缺少原始出處，只能當線索，不能當定論。<\/div><\/div><div class=\"chat\"><div class=\"chat-h\">網友彈幕<\/div><ul><li>查資料的第一課：同一件事，來源不同、答案就不同<\/li><li>謝謝收看，下課<\/li><\/ul><\/div>", "narration": "最後是出處。今天的內容，來自你們手上的講義，加上關鍵評論、杭州市方志、鉅亨網、中央研究院的年表等網路資料。有些說法不一致，我都標在畫面上了。這就是查資料的重要：同一件事，不同來源常常不一樣。謝謝大家。"}];
let idx = 0, auto = false, playing = false, token = 0, audioEl = null;
const $ = id => document.getElementById(id);
const card = $('card');

SLIDES.forEach((s, i) => {
  const sec = document.createElement('section');
  sec.className = 'slide'; sec.hidden = i !== 0; sec.innerHTML = s.html;
  card.appendChild(sec);
  const d = document.createElement('button');
  d.setAttribute('aria-label', '第' + (i + 1) + '頁 ' + s.label);
  d.title = s.label;
  d.onclick = () => go(i, true);
  $('dots').appendChild(d);
});

function note(t){ $('status').textContent = t || ''; }

function stopAudio(){
  token++;
  playing = false;
  try { if (audioEl) { audioEl.pause(); audioEl = null; } } catch(e){}
  try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch(e){}
  $('play').textContent = '朗讀本頁';
}

function refresh(){
  const slides = card.querySelectorAll('.slide');
  slides.forEach((el, i) => el.hidden = i !== idx);
  [...$('dots').children].forEach((b, i) => b.setAttribute('aria-current', i === idx ? 'true' : 'false'));
  $('count').textContent = (idx + 1) + ' / ' + SLIDES.length;
  $('prev').disabled = idx === 0; $('next').disabled = idx === SLIDES.length - 1;
  $('pg').textContent = SLIDES[idx].label;
  $('play').textContent = playing ? '停止朗讀' : '朗讀本頁';
}

function go(n, userInitiated){
  n = Math.max(0, Math.min(SLIDES.length - 1, n));
  stopAudio(); idx = n; note(''); refresh();
  window.scrollTo({top: 0});
  if (auto && (userInitiated || true)) speak();
}

function finished(my){
  if (my !== token) return;
  playing = false; refresh();
  if (auto && idx < SLIDES.length - 1) setTimeout(() => { if (auto && !playing) go(idx + 1); }, 700);
  else note('');
}

function pickVoice(){
  let v = [];
  try { v = speechSynthesis.getVoices(); } catch(e){}
  const by = f => v.find(x => f(x.lang.replace('_','-').toLowerCase()));
  return twVoice() || null; // 只用臺灣語音，不退回 zh-HK／zh-CN
}

// 若之後有上傳 audio/s1.mp3、s2.mp3… 錄音檔，把這個改成 true；否則直接用裝置語音，避免 iOS 擋掉非點擊時啟動的朗讀。
const USE_MP3 = false;
let ttsUnlocked = false;
function unlockTTS(){
  // iOS Safari 只允許在「點擊的當下」啟動語音朗讀；先在點擊時送一段無聲語音解鎖，之後換頁、自動播放才會有聲音。
  if (ttsUnlocked || !('speechSynthesis' in window)) return;
  try {
    const u = new SpeechSynthesisUtterance(' ');
    u.volume = 0;
    speechSynthesis.speak(u);
    ttsUnlocked = true;
  } catch(e){}
}

function speakTTS(my){
  if (!('speechSynthesis' in window)) { playing = false; refresh(); note('這個瀏覽器不支援朗讀，請改用 Chrome、Edge 或 Safari。'); return; }
  const text = SLIDES[idx].narration;
  const parts = text.match(/[^。！？]+[。！？]?/g) || [text];
  const voice = pickVoice();
  note(voice ? '朗讀中（' + voice.name + '）' : '朗讀中（此裝置沒有臺灣中文語音，建議改用 Edge 或 Chrome）');
  let i = 0;
  const next = () => {
    if (my !== token) return;
    if (i >= parts.length) return finished(my);
    const u = new SpeechSynthesisUtterance(parts[i++]);
    u.lang = 'zh-TW';
    if (voice) u.voice = voice;
    u.rate = parseFloat($('rate').value);
    u.onend = next;
    u.onerror = () => { if (my === token) { playing = false; refresh(); note('朗讀被瀏覽器中斷，請再按一次。'); } };
    speechSynthesis.speak(u);
  };
  next();
}

function speak(){
  stopAudio();
  const my = token; playing = true; refresh();
  unlockTTS();
  if (!USE_MP3) { speakTTS(my); return; }
  // Prefer a recorded file audio/sN.mp3 if one is published next to the page; otherwise read aloud with the browser voice.
  let fell = false;
  const fallback = () => { if (fell || my !== token) return; fell = true; audioEl = null; speakTTS(my); };
  try {
    const a = new Audio('audio/s' + (idx + 1) + '.mp3');
    a.playbackRate = parseFloat($('rate').value);
    audioEl = a;
    a.addEventListener('error', fallback);
    a.addEventListener('ended', () => finished(my));
    const pr = a.play();
    if (pr && pr.catch) pr.catch(fallback);
    note('播放錄音檔…');
  } catch(e){ fallback(); }
}

document.addEventListener('pointerdown', unlockTTS, {passive:true});
$('play').onclick = () => { playing ? (stopAudio(), refresh(), note('')) : speak(); };
$('auto').onclick = () => {
  auto = !auto; $('auto').setAttribute('aria-pressed', String(auto));
  if (auto && !playing) speak();
  if (!auto) note('');
};
$('rate').onchange = () => { if (playing) speak(); };
$('prev').onclick = () => go(idx - 1, true);
$('next').onclick = () => go(idx + 1, true);
document.addEventListener('keydown', e => {
  if (e.target && /^(SELECT|INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  if (e.key === 'ArrowRight') go(idx + 1, true);
  if (e.key === 'ArrowLeft') go(idx - 1, true);
});
let sx = null, sy = null;
card.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive:true});
card.addEventListener('touchend', e => {
  if (sx === null) return;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  sx = null;
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.8) go(idx + (dx < 0 ? 1 : -1), true);
}, {passive:true});
window.addEventListener('pagehide', () => { try { speechSynthesis.cancel(); } catch(e){} });
refresh();
</script>
